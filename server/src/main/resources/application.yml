spring:
  application:
    name: contestfit-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/contestfit?serverTimezone=Asia/Seoul&characterEncoding=utf8}
    username: ${DB_USERNAME:contestfit_app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
