name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      CONTESTFIT_SOURCE_MODE: "off"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run decision engine tests
        run: node --test tests/web/decision-engine.test.mjs

      - name: Check Python syntax
        run: python -m compileall -q src tests api

      - name: Check JavaScript syntax
        run: |
          for file in web/*.mjs scripts/*.mjs tests/e2e/*.mjs playwright.config.mjs; do node --check "$file"; done

      - name: Validate committed JSON data
        run: |
          python -c "import json, pathlib; [json.loads(path.read_text(encoding='utf-8')) for path in [*pathlib.Path('.').glob('*.json'), *pathlib.Path('web/data').glob('*.json'), *pathlib.Path('tests/fixtures').rglob('*.json')]]"

      - name: Check official API adapters against recorded payloads
        env:
          CONTESTFIT_SOURCE_MODE: fixture
        run: python -m posting_validation.sources.check --min-ok 8

  e2e:
    name: E2E (recorded API payloads)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests (desktop + mobile)
        run: npx playwright test

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-fixture
          path: |
            playwright-report/
            test-results/
          retention-days: 14
